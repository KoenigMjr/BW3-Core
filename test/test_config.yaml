#                German BOS Information Script
#

# for the test_config
types:
  string: Hello World
  bool: true
  integer: 11
  float: 3.14

# for the test_config
list:
  - one
  - two
  - three

list1:
  - list11:
      - one
      - two
      - three
  - list12:
    - one
    - two
    - three
  - string1

# for the test_doubleFilter
doubleFilter_test:
  ignoreTime: 10
  maxEntry: 3

doubleFilter_pocsagFields:
  pocsagFields:
    - ric
    - message

doubleFilter_default:
  testKey: testValue

descriptor_test:
  - scanField: tone
    descrField: description
    descriptions:
      - for: 12345
        add: Test 12345
      - for: 23456
        add: Test 23456

# for the test_routerManager
routerManager_test:
  router:
    - name: Router1
      route:
        - type: module
          res: template_module
          name: Test Module
        - type: plugin
          res: template_plugin
        - type: router
          res: Router2
    - name: Router2
      route:
        - type: module
          res: template_module

routerManager_duplicateName:
  router:
    - name: Router1
      route:
        - type: module
          res: template_module
    - name: Router1
      route:
        - type: module
          res: template_module

routerManager_missingName:
  router:
    - route:
        - type: module
          res: template_module

routerManager_missingRoute:
  router:
    - name: Router1

routerManager_missingType:
  router:
    - name: Router1
      route:
        - res: template_module

routerManager_unknownType:
  router:
    - name: Router1
      route:
        - type: unknown
          res: template_module

routerManager_moduleNotFound:
  router:
    - name: Router1
      route:
        - type: module
          res: notExistingModule

routerManager_unknownRouter:
  router:
    - name: Router1
      route:
        - type: router
          res: notExistingRouter

routerManager_saveStats:
  server:
    logging: true
  router:
    - name: Router1
      route:
        - type: module
          res: template_module
          name: Test Module
        - type: plugin
          res: template_plugin
        - type: router
          res: Router2
    - name: Router2
      route:
        - type: module
          res: template_module

# for the test_modeFilter
modeFilter_test:
  allowed:
    - fms
    - zvei

modeFilter_empty:
  testKey: testValue

# for the test_regexFilter
regexFilter_test:
  - name: "Zvei filter"
    checks:
      - field: tone
        regex: "65[0-9]{3}"
  - name: "FMS Stat 3"
    checks:
      - field: mode
        regex: "fms"
      - field: status
        regex: "3"
  - name: "Allowed RICs"
    checks:
      - field: ric
        regex: "(0000001|0000002|0000003)"

regexFilter_empty: []

# for the test_descriptor
descriptor_regex:
  - scanField: tone
    descrField: description
    descriptions:
      - for: 12345
        add: Exact 12345
      - for: '123.*'
        add: Regex 123
        isRegex: true
      - for: '890(1[1-9]|2[0-9])'
        add: 'Wache \1'
        isRegex: true
      - for: '891(1[1-9])'
        add: "Wache \\1 (BF)"
        isRegex: true
      - for: '[invalid'
        add: Invalid regex
        isRegex: true
      - for: '777.*'
        add: String flag
        isRegex: 'true'
      - for: '05678'
        add: Leading zero
      - for: 55555
        add: 'Alarm {MODE} {TONE}'

descriptor_multi:
  - scanField: tone
    descrField: description
    descriptions:
      - for: 12345
        add: Test 12345
  - scanField: status
    descrField: statusText
    wildcard: "{STATUSTEXT}"
    descriptions:
      - for: 3
        add: Einsatz Ab

descriptor_csv:
  - scanField: tone
    descrField: description
    csvPath: test/test_descriptor.csv
    descriptions:
      - for: '1234.*'
        add: YAML regex
        isRegex: true

descriptor_csvNotFound:
  - scanField: tone
    descrField: description
    csvPath: test/notExisting.csv
    descriptions:
      - for: 12345
        add: YAML 12345

# for the test_geocoding
geocoding_mapbox:
  apiProvider: mapbox
  apiToken: testToken
  regex: "Adresse: (.*)"

geocoding_google:
  apiProvider: google
  apiToken: testToken
  regex: "Adresse: (.*)"

geocoding_unknownProvider:
  apiProvider: unknown
  apiToken: testToken
  regex: "Adresse: (.*)"
