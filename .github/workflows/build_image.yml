name: Build Docker Images

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Setzt Buildx auf – das ist der Turbo für Docker Builds (Caching!)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push für den Server
      - name: Build and push Server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: server
          push: true
          tags: ghcr.io/koenigmjr/bw3-core-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push für den Client
      - name: Build and push Client
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: client
          push: true
          tags: ghcr.io/koenigmjr/bw3-core-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max